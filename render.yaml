# ==============================================================================
# Render Blueprint Specification for legal-ai-fe
# ==============================================================================
version: "1"

services:
  - type: web
    name: legal-ai-fe
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://legal-ai-backend-75al.onrender.com
      - key: NODE_VERSION
        value: 22
